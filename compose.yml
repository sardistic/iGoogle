services:
  web:
    build: .
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    mem_limit: 64m
    networks:
      edge:
        aliases: [sard-igoogle]
networks:
  edge:
    external: true
