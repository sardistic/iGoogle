server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.sardistic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://analytics.sardistic.com https://geocoding-api.open-meteo.com https://api.open-meteo.com https://hn.algolia.com https://api.rss2json.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.google.com; frame-ancestors 'self'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(?:css|js|svg)$ { expires 1h; }
}
